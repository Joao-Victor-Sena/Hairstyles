<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Entrar | Hairstyles</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="brand" href="/index.html">Hairstyles<span>studio</span></a>
      <div class="auth-card">
        <p class="eyebrow">Bem-vinda de volta</p>
        <h1>Entre no seu<br /><em>momento.</em></h1>
        <form id="login-form">
          <label
            >E-mail<input
              type="email"
              name="email"
              required
              maxlength="120"
              autocomplete="email" /></label
          ><label
            >Senha<input
              type="password"
              name="password"
              required
              minlength="8"
              autocomplete="current-password" /></label
          ><label class="check"
            ><input type="checkbox" required /> Aceito os termos de política,
            privacidade e uso de dados.</label
          ><button class="button" type="submit">Entrar</button>
          <p class="form-feedback" role="status"></p>
        </form>
        <div class="auth-links">
          <a href="#" id="recover-link">Esqueceu a senha?</a
          ><a href="/cadastro.html">Criar cadastro</a>
        </div>
      </div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
